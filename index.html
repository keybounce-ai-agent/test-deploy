<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple Hello, world! page for GitHub Pages.">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f3f6fb; color: #172033; }
    main { padding: 2.5rem; text-align: center; }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -0.05em; }
    p { color: #566176; font-size: 1.15rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      p { color: #b8c2d3; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world!</h1>
    <p>Your GitHub Pages site is working.</p>
  </main>
</body>
</html>
